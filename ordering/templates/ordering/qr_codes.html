<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grill King Table QR Codes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .print-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .print-btn {
            border: none;
            background: #111;
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .grid {
            max-width: 1200px;
            margin: auto;

            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 22px;
        }

        .table-card {
            background: white;
            border-radius: 18px;
            padding: 24px 18px;
            text-align: center;

            box-shadow:
                0 4px 16px rgba(0,0,0,0.08);
        }

        .brand {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .table-number {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .table-card img {
            width: 180px;
            height: 180px;
            display: block;
            margin: auto;
        }

        .scan-text {
            margin-top: 18px;
            font-size: 17px;
            font-weight: bold;
        }

        .scan-subtext {
            margin-top: 5px;
            color: #777;
            font-size: 13px;
        }

        @media print {

            @page {
                margin: 10mm;
            }

            body {
                background: white;
                padding: 0;
            }

            h1,
            .print-area {
                display: none;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12mm;
            }

            .table-card {
                box-shadow: none;
                border: 1px solid #ccc;
                border-radius: 12px;
                padding: 12mm;

                break-inside: avoid;
                page-break-inside: avoid;
            }

            .table-card img {
                width: 50mm;
                height: 50mm;
            }
        }
    </style>
</head>

<body>

    <h1>GRILL KING · TABLE QR CODES</h1>

    <div class="print-area">
        <button
            class="print-btn"
            onclick="window.print()">
            Print QR Codes
        </button>
    </div>

    <div class="grid">

        {% for table in tables %}

            <div class="table-card">

                <div class="brand">
                    GRILL KING
                </div>

                <div class="table-number">
                    Table {{ table.number|stringformat:"02d" }}
                </div>

                <img
                    src="data:image/png;base64,{{ table.qr }}"
                    alt="Table {{ table.number }} QR Code"
                >

                <div class="scan-text">
                    Scan to Order
                </div>

                <div class="scan-subtext">
                    Scan with your phone camera
                </div>

            </div>

        {% endfor %}

    </div>

</body>
</html>
