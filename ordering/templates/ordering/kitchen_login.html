<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 360px;
            background: white;
            color: #111;
            padding: 32px;
            border-radius: 16px;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 22px;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .error {
            color: #d70000;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>GRILL KING</h1>
    <p>Kitchen Display</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input
            type="password"
            name="pin"
            placeholder="Enter Kitchen PIN"
            inputmode="numeric"
            required
        >

        <button type="submit">
            Open Kitchen
        </button>
    </form>

</div>

</body>
</html>
